<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Copilot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot" id="status-dot" aria-hidden="true"></span>
        <span class="brand-name">Page Copilot</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-open-file" title="打开本地 PDF（也可以直接把文件拖进来）" aria-label="打开本地 PDF">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button class="icon-btn" id="btn-refresh" title="重新读取当前页面" aria-label="重新读取当前页面">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button class="icon-btn" id="btn-new" title="新对话" aria-label="新对话">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="icon-btn" id="btn-settings" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <div class="pagebar" id="pagebar">
      <span class="page-title" id="page-title">正在读取当前页面…</span>
      <span class="page-meta" id="page-meta"></span>
    </div>

    <div class="notice-bar" id="notice-bar" hidden>
      <span class="notice-text" id="notice-text"></span>
      <button class="ghost-btn" id="notice-action" hidden>选择文件</button>
    </div>

    <input type="file" id="file-input" accept=".pdf,application/pdf" hidden>

    <main class="messages" id="messages" aria-live="polite">
      <div class="empty-state" id="empty-state">
        <div class="empty-logo">◈</div>
        <p class="empty-title">问问这个页面</p>
        <p class="empty-sub">我会自动读取你当前正在看的网页，需要时再联网查资料。</p>
        <div class="quick-actions" id="quick-actions">
          <button class="quick" data-action="summarize">总结本页要点</button>
          <button class="quick" data-action="explain">解释选中内容</button>
          <button class="quick" data-action="detail">展开关键细节</button>
          <button class="quick" data-action="translate">翻译成中文</button>
        </div>
      </div>
    </main>

    <div class="composer-wrap">
      <div class="composer-toggles">
        <button class="toggle on" id="toggle-page" title="发送时附带当前页面内容">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <span id="toggle-page-label">页面</span>
        </button>
        <button class="toggle on" id="toggle-search" title="点击切换：自动检索 / 强制检索 / 关闭">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <span id="toggle-search-label">自动联网</span>
        </button>
        <span class="composer-hint" id="composer-hint"></span>
      </div>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="问点什么…（Enter 发送 / Shift+Enter 换行）"></textarea>
        <button class="send-btn" id="btn-send" title="发送" aria-label="发送">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 设置面板 -->
  <div class="drawer-mask" id="drawer-mask" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="设置">
    <div class="drawer-head">
      <h2>设置</h2>
      <button class="icon-btn" id="btn-close-drawer" aria-label="关闭设置">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="drawer-body">
      <section class="field-group">
        <div class="group-title">模型接口</div>

        <label class="field">
          <span class="label-text">快速预设</span>
          <select id="preset-select">
            <option value="">手动填写…</option>
          </select>
        </label>

        <label class="field">
          <span class="label-text">Base URL</span>
          <input type="text" id="set-baseurl" placeholder="https://api.deepseek.com/v1" spellcheck="false">
          <span class="hint">DeepSeek 填 <code>https://api.deepseek.com/v1</code></span>
        </label>

        <label class="field">
          <span class="label-text">模型名</span>
          <input type="text" id="set-model" placeholder="deepseek-chat" spellcheck="false" list="model-list">
          <datalist id="model-list"></datalist>
          <span class="hint">deepseek-chat 支持工具调用；deepseek-reasoner 不支持，会自动改用本地预检索</span>
        </label>

        <label class="field">
          <span class="label-text">API Key</span>
          <div class="input-row">
            <input type="password" id="set-apikey" placeholder="sk-…" spellcheck="false" autocomplete="off">
            <button class="ghost-btn" id="btn-toggle-key" type="button">显示</button>
          </div>
          <span class="hint">只存在本机 chrome.storage.local，不经过任何中转服务器</span>
        </label>

        <label class="field">
          <span class="label-text">温度 <span class="value-badge" id="temp-badge">0.3</span></span>
          <input type="range" id="set-temperature" min="0" max="1.5" step="0.1">
        </label>
      </section>

      <section class="field-group">
        <div class="group-title">页面上下文</div>
        <label class="field">
          <span class="label-text">页面正文上限（字符）<span class="value-badge" id="chars-badge">24000</span></span>
          <input type="range" id="set-maxchars" min="4000" max="60000" step="2000">
          <span class="hint">太大会烧 token，长文建议 20000–30000</span>
        </label>
        <label class="field">
          <span class="label-text">历史轮数上限<span class="value-badge" id="history-badge">8</span></span>
          <input type="range" id="set-history" min="2" max="20" step="1">
        </label>
      </section>

      <section class="field-group">
        <div class="group-title">联网搜索</div>
        <label class="field">
          <span class="label-text">搜索后端</span>
          <select id="set-searchprovider">
            <option value="bing">Bing（免 Key，实测最稳，默认）</option>
            <option value="duckduckgo">DuckDuckGo（免 Key，更私密，偶尔被风控）</option>
            <option value="tavily">Tavily（需 Key，结果质量最好）</option>
          </select>
          <span class="hint">DeepSeek 本身没有内置联网能力，搜索由扩展在本地完成；首选后端失败会自动切换另一个</span>
        </label>
        <label class="field">
          <span class="label-text">Tavily API Key（可选）</span>
          <input type="password" id="set-tavilykey" placeholder="tvly-…" spellcheck="false" autocomplete="off">
        </label>
        <label class="check-row">
          <input type="checkbox" id="set-readurl">
          <span>允许模型抓取搜索结果里的页面全文（read_url 工具）</span>
        </label>
      </section>

      <section class="field-group">
        <div class="group-title">高级</div>
        <label class="field">
          <span class="label-text">自定义系统提示词（留空用内置）</span>
          <textarea id="set-systemprompt" rows="4" placeholder="留空则使用内置提示词"></textarea>
        </label>
        <label class="check-row">
          <input type="checkbox" id="set-reasoning">
          <span>显示 deepseek-reasoner 的思考过程</span>
        </label>
      </section>

      <div class="drawer-foot">
        <button class="primary-btn" id="btn-save">保存</button>
        <button class="ghost-btn" id="btn-reset">恢复默认</button>
      </div>
      <p class="foot-note">v1.0.0 · 无账号、无遥测、无中转</p>
    </div>
  </aside>

  <script type="module" src="app.js"></script>
</body>
</html>
